<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>地域ガイドの移転 | {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.redirect.to | escape }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/mountain-mark.svg' | relative_url }}">
    <script>
      const destination = new URL(document.querySelector('link[rel="canonical"]').href);
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
    <meta http-equiv="refresh" content="0;url={{ page.redirect.to | escape }}">
  </head>
  <body>
    <p>この地域ガイドは移転しました。<a href="{{ page.redirect.to | escape }}">新しいページを開く</a></p>
  </body>
</html>
